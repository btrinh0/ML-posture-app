name: Windows desktop

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win
      - name: Verify the packaged desktop app
        run: npm run test:desktop -- release/win-unpacked/Deskframe.exe
      - uses: actions/upload-artifact@v7
        with:
          name: Deskframe-Windows-x64
          path: release/Deskframe-Setup-*.exe
          if-no-files-found: error
          compression-level: 0
