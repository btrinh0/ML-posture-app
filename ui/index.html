<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Deskframe</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./dashboard.mjs"></script>
  </head>
  <body>
    <aside class="rail">
      <div class="brand"><img src="./assets/icon.png" alt="" />Deskframe</div>
      <nav aria-label="Workspace">
        <button data-page="today" aria-current="page">Study desk</button>
        <button data-page="setup">Desk setup</button>
      </nav>
      <div class="account">
        <label for="profiles">Local profile</label
        ><select id="profiles"></select
        ><button class="link" id="add-profile">Add profile</button>
      </div>
    </aside>
    <main>
      <header>
        <p id="date"></p>
        <span class="local"><span class="dot"></span> On this device</span>
      </header>
      <div id="feedback" role="status" hidden></div>
      <section id="today" class="page">
        <h1>Study desk</h1>
        <article class="focus">
          <div class="focus-header">
            <h2>Study session</h2>
            <span id="session-status">Ready</span>
          </div>
          <p id="clock" aria-label="Active study time">00:00</p>
          <div class="focus-foot">
            <button id="session-button" class="accent">Start session</button>
          </div>
        </article>
        <div class="columns">
          <article class="card">
            <h2>Daily check-in</h2>
            <p class="muted">Rate each area from 0 (none) to 10 (highest).</p>
            <form id="symptoms" class="stack">
              <div id="scores"></div>
              <button class="primary" type="submit">Save check-in</button>
            </form>
          </article>
          <article class="card">
            <p id="desk-status"></p>
            <button class="link" data-open="setup">Review desk setup ↗</button>
          </article>
        </div>
        <article class="card">
          <h2>Recent sessions</h2>
          <div id="history" class="rows"></div>
        </article>
      </section>
      <section id="setup" class="page" hidden>
        <h1>Desk setup</h1>
        <article class="card">
          <h2>Workstation check</h2>
          <form id="setup-form" class="stack">
            <div id="questions"></div>
            <button class="primary" type="submit">Save desk setup</button>
          </form>
        </article>
        <article class="card" id="adjustments" hidden>
          <h2>Desk adjustments</h2>
          <div id="advice"></div>
        </article>
      </section>
    </main>
    <dialog id="profile-dialog">
      <form id="profile-form" class="stack">
        <h2>Add a local profile</h2>
        <label>Nickname<input id="alias" maxlength="32" required autocomplete="off" /></label>
        <div class="controls">
          <button class="primary">Create profile</button
          ><button id="cancel-profile" type="button">Cancel</button>
        </div>
      </form>
    </dialog>
  </body>
</html>
