<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Deskframe</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./dashboard.mjs"></script>
  </head>
  <body>
    <aside class="rail">
      <div class="brand"><img src="./assets/icon.png" alt="" />Deskframe</div>
      <nav aria-label="Workspace">
        <button data-page="today" aria-current="page">Study desk</button>
        <button data-page="setup">Desk setup</button>
      </nav>
    </aside>
    <main>
      <header>
        <p id="date"></p>
        <span class="local"><span class="dot"></span> On this device</span>
      </header>
      <div id="feedback" role="status" hidden></div>
      <section id="today" class="page">
        <h1>Study desk</h1>
          <article class="card">
            <p id="desk-status"></p>
            <button class="link" data-open="setup">Review desk setup ↗</button>
          </article>
      </section>
      <section id="setup" class="page" hidden>
        <h1>Desk setup</h1>
        <article class="card">
          <h2>Workstation check</h2>
          <form id="setup-form" class="stack">
            <div id="questions"></div>
            <button class="primary" type="submit">Save desk setup</button>
          </form>
        </article>
        <article class="card" id="adjustments" hidden>
          <h2>Desk adjustments</h2>
          <div id="advice"></div>
        </article>
      </section>
    </main>
  </body>
</html>
